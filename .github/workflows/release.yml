name: release

# A tag like v0.1.0 builds the presidio-guard image for linux/amd64 and
# linux/arm64, pushes it to ghcr.io/<owner>/presidio-guard:<tag>, and writes the
# image reference with its digest into the GitHub release (creating the release
# when release-please has not).
# release-please calls it after tagging; a tag pushed by hand starts it too.
# The job can be run again for the same tag: the push moves the image tag to the
# new build, and the release notes are rewritten with its digest.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  # Runs the current workflow again for a release that was already tagged.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.2.0
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/presidio-guard
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Check the tag is on main
        run: git merge-base --is-ancestor "$(git rev-list -n 1 "${TAG}")" origin/main

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test
        run: |
          go vet ./...
          go test ./...

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # provenance off keeps the image index to the two platforms, so registries
      # don't list an unknown/unknown entry next to them.
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.TAG }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0

      - name: Release notes from the changelog, with the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          awk -v v="${TAG#v}" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ || /^\[[^]]+\]: / {on=0} on' CHANGELOG.md > "${RUNNER_TEMP}/notes.md" || true
          test -s "${RUNNER_TEMP}/notes.md" || echo "Release ${TAG}" > "${RUNNER_TEMP}/notes.md"
          {
            echo
            echo "## Image"
            echo
            echo '```'
            echo "${IMAGE}:${TAG}@${DIGEST}"
            echo '```'
          } >> "${RUNNER_TEMP}/notes.md"
          echo "Pushed ${IMAGE}:${TAG}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" --notes-file "${RUNNER_TEMP}/notes.md"
          else
            gh release create "${TAG}" --verify-tag --title "${TAG}" --notes-file "${RUNNER_TEMP}/notes.md"
          fi
